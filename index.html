<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Web Design</title>
        
        <style>
            *{
                box-sizing: border-box;
            }
            html{
                background: #b5bdc5;
            }
            body{
                width: min(820px, 100%);
                margin: 0 auto;
                min-height: 100vh;
                background: #F9FAFE;
                display: grid;
                grid-template-columns: minmax(0, 2.05fr) minmax(0, 1fr);
                align-items: stretch;
                gap: 16px;
                padding: 28px 20px 40px;
            }
            header,nav,footer{
                grid-column: 1 / -1;
            }
            header{
                background-color: #ECE4FC;
                color: #7946E4;
                border-color: #7946E4;
                height: 92px;
                display:grid;
                place-items: center;
                border: 3px solid;
            }
            nav{
                display:grid;
                place-items: center;
                background-color: #E0F0FD;
                border-color: #8FC5EC;
                height: 72px;
                place-items: center;
                color:#8FC5EC;
                border: 3px solid;

            }
            header,nav,main,article,section,aside,footer{
                border-radius: 10px;
            }
            main{
                display:flex;
                border-color:#69B09D;
                background-color:#E5F3F3;
                color:#69B09D;
                flex-direction: column;
                gap: 16px;
                padding: 16px;
                place-items: center;
                border: 3px solid;
            }
            aside{
                background-color: #E1ECF4;
                color: #3B6B98;
                border-color: #3B6B98;
                display:grid;
                place-items: center;
                padding: 16px;
                border: 3px solid;
            }
            article{
                border-color: #C06349;
                color: #C06349;
                background-color: #EAE1DC;
                display:grid;
                place-items: center;
                padding: 16px;
                min-height: 180px;
                border: 3px solid;
                width: 450px;
            }
            section{
                background-color: #DAE3F4;
                color: #8A76D3;
                border-color: #8A76D3;
                display:grid;
                place-items: center;
                padding: 16px;
                min-height: 180px;
                border: 3px solid;
                width: 450px;
            }
            footer{
                background-color: #E0EEEE;
                border-color: #6BACA0;
                color: #6BACA0;
                height: 100px;
                display:grid;
                place-items: center;
                border: 3px solid;
            }
            @media (max-width: 700px) {
                body{
                    grid-template-columns: 1fr;
                }
                header,
                nav,
                main,
                article,
                section,
                aside,
                footer{
                    font-size: 25px;
                }
                aside{
                    min-height: 180px;
                }
            }
        </style>
    </head>
    <body>
        <header>Header</header>
        <nav>Navigation</nav>
        <main>
            
            <article>Article</article>
            <section>Section</section>
        </main>
        <aside>Aside</aside>
        <footer>Footer</footer>
    </body>
</html>
